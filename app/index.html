<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafetyEye</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: sans-serif; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  #status { position: absolute; top: 8px; left: 8px; z-index: 10; background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 6px; font-size: 14px; }
  #zoneForm {
    position: absolute; z-index: 20; background: #1c1c1c; border: 1px solid #444;
    border-radius: 8px; padding: 10px; font-size: 13px; display: none;
  }
  #zoneForm label { display: block; margin-top: 6px; }
  #zoneForm input, #zoneForm select { width: 160px; box-sizing: border-box; }
  #zoneForm button { margin-top: 8px; margin-right: 6px; }
  #drawZoneBtn {
    position: absolute; top: 8px; right: 8px; z-index: 10;
    background: #00ff88; color: #111; border: none; padding: 6px 12px;
    border-radius: 6px; font-weight: bold; cursor: pointer;
  }
  #alertBanner {
    position: absolute; bottom: 8px; left: 8px; right: 8px; z-index: 10;
    max-height: 30%; overflow-y: auto; font-size: 13px;
  }
  .alert-warn, .alert-breach {
    padding: 4px 8px; margin-top: 4px; border-radius: 6px; color: #111;
  }
  .alert-warn { background: #ffcc00; }
  .alert-breach { background: #ff4444; color: #fff; }
</style>
</head>
<body>
  <div id="stage">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="status">starting…</div>
    <button id="drawZoneBtn">Draw Zone</button>
    <div id="alertBanner"></div>

    <div id="zoneForm">
      <label>Name <input id="zoneName" placeholder="press"></label>
      <label>Rule type
        <select id="zoneType">
          <option value="zone_intrusion">zone_intrusion</option>
          <option value="occupancy">occupancy</option>
          <option value="obstruction">obstruction</option>
          <option value="proximity">proximity</option>
        </select>
      </label>
      <label>Limit <input id="zoneLimit" type="number" value="1"></label>
      <label>Severity
        <select id="zoneSeverity">
          <option value="warn">warn</option>
          <option value="critical">critical</option>
        </select>
      </label>
      <label>Say <input id="zoneSay" placeholder="Step back from the press"></label>
      <div>
        <button id="zoneSaveBtn">Add</button>
        <button id="zoneCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="../vendor/tfjs/tf.min.js"></script>
  <script src="../vendor/coco-ssd/coco-ssd.min.js"></script>
  <script src="vision.js"></script>
  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
