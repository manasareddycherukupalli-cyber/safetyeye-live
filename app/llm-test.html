<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SafetyEye — model bench</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:16px; background:#0d1117; color:#e6edf3;
         font:15px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  h1 { font-size:16px; margin:0 0 4px; }
  .sub { color:#7d8590; font-size:13px; margin-bottom:16px; }
  #status { padding:6px 10px; border-radius:6px; display:inline-block;
            font-size:13px; margin-bottom:16px; }
  .up   { background:#12261a; color:#3fb950; }
  .down { background:#2a1215; color:#f85149; }
  textarea { width:100%; box-sizing:border-box; background:#161b22; color:#e6edf3;
             border:1px solid #30363d; border-radius:6px; padding:10px;
             font:inherit; min-height:72px; }
  button { margin-top:10px; width:100%; padding:12px; font:inherit; font-weight:600;
           background:#238636; color:#fff; border:0; border-radius:6px; }
  button:disabled { background:#30363d; color:#7d8590; }
  pre { background:#161b22; border:1px solid #30363d; border-radius:6px;
        padding:10px; overflow-x:auto; font-size:13px; white-space:pre-wrap;
        word-break:break-word; }
  .timing { color:#7d8590; font-size:13px; }
  .ex { color:#58a6ff; font-size:13px; margin:8px 0 0; }
  .ex span { text-decoration:underline; }
</style>

<h1>SafetyEye — model bench</h1>
<div class="sub">Speech → enforced rule, on the phone. Nothing leaves the device.</div>
<div id="status" class="down">checking model…</div>

<textarea id="in" placeholder="Say a safety rule in plain English…">Warn anyone who gets close to the press</textarea>
<p class="ex">try:
  <span onclick="fill(this)">no more than 4 people on the scaffold</span> ·
  <span onclick="fill(this)">the fire exit must never be blocked</span>
</p>
<button id="go">Compile to rules</button>

<h1 style="margin-top:20px">Output</h1>
<div class="timing" id="timing">—</div>
<pre id="out">waiting</pre>

<script src="./pwa.js"></script>
<script src="./llm.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const ZONES = ['press', 'exit', 'scaffold'];

  function fill(el) { $('in').value = el.textContent.trim(); }

  LLM.health().then(up => {
    $('status').className = up ? 'up' : 'down';
    $('status').textContent = up ? 'model up · on-device · offline' : 'model unreachable';
  });

  $('go').onclick = async () => {
    const btn = $('go');
    btn.disabled = true;
    btn.textContent = 'thinking…';
    $('out').textContent = '';
    $('timing').textContent = '—';
    try {
      const { rules, ms, usage } = await LLM.compileRules($('in').value, ZONES);
      $('out').textContent = JSON.stringify(rules, null, 2);
      const tps = usage ? (usage.completion_tokens / (ms / 1000)).toFixed(1) : '?';
      $('timing').textContent = `${ms} ms · ${usage?.completion_tokens ?? '?'} tokens · ${tps} tok/s`;
    } catch (e) {
      $('out').textContent = 'ERROR\n\n' + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Compile to rules';
    }
  };
</script>
